plugins {
    id 'java'
    id 'application'
}

group = 'com.secaware'
version = '1.0.0'

repositories {
    mavenCentral()
}

dependencies {
    def micronautPlatform = 'io.micronaut.platform:micronaut-platform:4.7.6'
    implementation platform(micronautPlatform)
    annotationProcessor platform(micronautPlatform)
    testImplementation platform(micronautPlatform)
    testAnnotationProcessor platform(micronautPlatform)

    annotationProcessor 'io.micronaut:micronaut-inject-java'
    annotationProcessor 'io.micronaut.validation:micronaut-validation-processor'
    annotationProcessor 'io.micronaut.data:micronaut-data-processor'

    implementation 'io.micronaut:micronaut-http-server-netty'
    implementation 'io.micronaut:micronaut-jackson-databind'
    // Micronaut 读取 application.yml 必需的 YAML 解析器（不随 jackson-databind 传递）
    implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-yaml:2.17.2'
    implementation 'io.micronaut.validation:micronaut-validation'
    implementation 'io.micronaut.security:micronaut-security'
    implementation 'io.micronaut.data:micronaut-data-jdbc'
    implementation 'io.micronaut.sql:micronaut-jdbc-hikari'
    implementation 'io.projectreactor:reactor-core:3.7.0'
    implementation 'io.reactivex.rxjava3:rxjava:3.1.9'

    runtimeOnly 'com.h2database:h2:2.3.232'
    runtimeOnly 'ch.qos.logback:logback-classic:1.5.12'

    testAnnotationProcessor 'io.micronaut:micronaut-inject-java'
    testImplementation 'io.micronaut:micronaut-http-client'
    testImplementation 'io.micronaut.test:micronaut-test-junit5'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.11.4'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

application {
    mainClass = 'com.secaware.phishdrill.Application'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    testLogging {
        showStandardStreams = true
        exceptionFormat = 'full'
        events = ['started', 'passed', 'skipped', 'failed']
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs.add('-parameters')
}
