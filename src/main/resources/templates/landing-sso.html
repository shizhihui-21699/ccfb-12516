<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>企业统一身份认证</title>
</head>
<body style="margin:0;background:#f3f4f6;font-family:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;color:#111827">
<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px">
  <div style="width:100%;max-width:400px;background:#fff;border:1px solid #e5e7eb;border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.08);overflow:hidden">
    <div style="background:#0f2b5c;color:#fff;padding:18px 26px">
      <div style="font-size:18px;font-weight:700;letter-spacing:.5px">企业统一身份认证 SSO</div>
      <div style="font-size:12px;opacity:.8;margin-top:4px">Corporate Single Sign-On</div>
    </div>
    <form method="post" action="{{formAction}}" style="padding:28px 26px">
      <label style="display:block;font-size:13px;font-weight:600;margin-bottom:6px">企业账号</label>
      <input name="username" type="text" value="{{email}}" autocomplete="username"
             style="width:100%;box-sizing:border-box;padding:10px 12px;border:1px solid #d1d5db;border-radius:6px;font-size:14px;margin-bottom:18px;background:#f9fafb">
      <label style="display:block;font-size:13px;font-weight:600;margin-bottom:6px">登录密码</label>
      <input name="password" type="password" autocomplete="current-password"
             style="width:100%;box-sizing:border-box;padding:10px 12px;border:1px solid #d1d5db;border-radius:6px;font-size:14px;margin-bottom:8px">
      <div style="font-size:12px;color:#6b7280;margin-bottom:20px">登录即表示同意《企业信息系统使用规范》</div>
      <button type="submit" style="width:100%;background:#0f2b5c;color:#fff;border:none;padding:12px;border-radius:6px;font-size:15px;font-weight:600;cursor:pointer">登 录</button>
    </form>
    <div style="padding:12px 26px;background:#f9fafb;border-top:1px solid #e5e7eb;font-size:11px;color:#9ca3af;text-align:center">
      信息安全部 · 内部系统
    </div>
  </div>
</div>
</body>
</html>
