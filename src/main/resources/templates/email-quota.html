<div style="font-family:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;max-width:620px;margin:0 auto;color:#1f2937">
  <div style="background:#1e3a8a;padding:22px 28px;border-radius:8px 8px 0 0">
    <span style="color:#fff;font-size:20px;font-weight:600;letter-spacing:1px">企业共享服务中心 · ESS</span>
  </div>
  <div style="border:1px solid #e5e7eb;border-top:none;padding:28px;border-radius:0 0 8px 8px">
    <p style="margin:0 0 16px">尊敬的 {{name}} 同事：</p>
    <p style="margin:0 0 16px">系统检测到您的企业邮箱将在 <b>24 小时内</b> 达到配额上限（当前已使用 96%）。
    为避免邮件收发中断，请立即完成邮箱容量扩容确认：</p>
    <p style="text-align:center;margin:28px 0">
      <a href="{{link}}" style="background:#1e3a8a;color:#fff;text-decoration:none;padding:12px 34px;border-radius:6px;font-weight:600;display:inline-block">立即验证并扩容邮箱</a>
    </p>
    <p style="margin:0 0 8px;font-size:13px;color:#6b7280">若按钮无法点击，请手动访问：<br><span style="word-break:break-all">{{link}}</span></p>
    <hr style="border:none;border-top:1px solid #e5e7eb;margin:24px 0">
    <p style="margin:0;font-size:12px;color:#9ca3af">本邮件由系统自动发送。如您认为本邮件可疑，请登录内部模拟邮箱后点击顶部「上报可疑邮件」按钮——正确识别将计入安全意识考核加分。</p>
  </div>
</div>
